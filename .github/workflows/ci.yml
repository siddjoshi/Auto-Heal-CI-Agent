# ============================================================================
# Self-Healing CI/CD Pipeline
# ============================================================================
# This workflow runs tests and lint on every push/PR. If CI fails, it
# automatically invokes GitHub Copilot CLI to diagnose and fix the issue,
# then commits the fix and re-triggers the pipeline.
#
# Kill switch: Set repository variable ENABLE_SELF_HEAL=false to disable.
# ============================================================================

name: CI Pipeline (Self-Healing)

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  # ===========================================================================
  # Job 1: Build, Lint, and Test
  # ===========================================================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    outputs:
      test-status: ${{ steps.test.outcome }}
      lint-status: ${{ steps.lint.outcome }}
      build-status: ${{ steps.build.outcome }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        id: install
        run: npm ci 2>&1 | tee ci-output.log

      - name: Run linter
        id: lint
        continue-on-error: true
        run: |
          npm run lint:json 2>&1 | tee -a ci-output.log
          npm run lint 2>&1 | tee -a ci-output.log

      - name: Run build check
        id: build
        continue-on-error: true
        run: npm run build 2>&1 | tee -a ci-output.log

      - name: Run tests
        id: test
        continue-on-error: true
        run: |
          npm run test:json 2>&1 | tee -a ci-output.log
          npm test 2>&1 | tee -a ci-output.log

      - name: Upload CI artifacts
        if: steps.test.outcome == 'failure' || steps.lint.outcome == 'failure' || steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-artifacts
          path: |
            ci-output.log
            test-results.json
            lint-output.json
          retention-days: 5

      - name: Check results
        run: |
          echo "Lint: ${{ steps.lint.outcome }}"
          echo "Build: ${{ steps.build.outcome }}"
          echo "Test: ${{ steps.test.outcome }}"
          if [[ "${{ steps.lint.outcome }}" == "failure" ]] || \
             [[ "${{ steps.build.outcome }}" == "failure" ]] || \
             [[ "${{ steps.test.outcome }}" == "failure" ]]; then
            echo "CI_FAILED=true" >> "$GITHUB_ENV"
            exit 1
          fi

  # ===========================================================================
  # Job 2: Auto-Heal (runs only on failure)
  # ===========================================================================
  auto-heal:
    name: Auto-Heal (Attempt ${{ github.run_attempt }})
    needs: build-and-test
    if: |
      always() &&
      needs.build-and-test.result == 'failure' &&
      github.event_name == 'push' &&
      vars.ENABLE_SELF_HEAL != 'false' &&
      github.run_attempt <= 3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download failure artifacts
        uses: actions/download-artifact@v4
        with:
          name: ci-failure-artifacts
        continue-on-error: true

      - name: Install Copilot CLI
        run: npm install -g @github/copilot
        env:
          GH_TOKEN: ${{ secrets.COPILOT_TOKEN }}

      - name: Reproduce failures for handler input
        run: |
          # Re-run failing steps to generate fresh output files
          npm run lint:json 2>&1 || true
          npm run test:json 2>&1 || true
          npm run build 2>&1 | tee ci-output.log || true

      - name: Run self-healing orchestrator
        env:
          GH_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          ENABLE_SELF_HEAL: ${{ vars.ENABLE_SELF_HEAL }}
        run: |
          chmod +x scripts/heal.sh scripts/handlers/*.sh scripts/safety-guard.sh scripts/validate-changes.sh
          bash scripts/heal.sh \
            --log-file ci-output.log \
            --max-attempts 3 \
            --mode direct

      - name: Validate changed files
        run: |
          bash scripts/validate-changes.sh

      - name: Commit and push fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if there are changes to commit
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes detected. Copilot may not have made any edits."
            exit 1
          fi

          # Stage only source and test files (safety: not workflows or scripts)
          git add src/ tests/

          # Create descriptive commit message
          ATTEMPT="${{ github.run_attempt }}"
          git commit -m "fix: auto-heal CI failure (attempt ${ATTEMPT})

          Applied by self-healing CI pipeline using GitHub Copilot CLI.
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          git push

      - name: Upload heal audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heal-audit-attempt-${{ github.run_attempt }}
          path: .heal-audit/
          retention-days: 30

  # ===========================================================================
  # Job 3: Fallback — create issue when healing is exhausted
  # ===========================================================================
  fallback:
    name: Create Issue (Heal Exhausted)
    needs: [build-and-test, auto-heal]
    if: |
      always() &&
      needs.auto-heal.result == 'failure' &&
      github.run_attempt >= 3
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub Issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = `CI self-healing exhausted on ${context.ref}`;
            const body = [
              '## Self-Healing Pipeline Exhausted',
              '',
              `**Branch:** \`${context.ref}\``,
              `**Commit:** \`${context.sha}\``,
              `**Workflow Run:** [View run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              `**Attempts:** 3 / 3`,
              '',
              '### What happened',
              'The CI pipeline failed and the self-healing agent was unable to fix the issue after 3 attempts.',
              '',
              '### Next steps',
              '1. Review the workflow run logs and heal audit artifacts.',
              '2. Fix the issue manually.',
              '3. Re-enable self-healing if it was disabled.',
              '',
              '---',
              '*This issue was created automatically by the self-healing CI pipeline.*'
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['ci-failure', 'auto-heal-exhausted']
            });
