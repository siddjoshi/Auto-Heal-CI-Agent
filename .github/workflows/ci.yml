# ============================================================================
# Self-Healing CI/CD Pipeline
# ============================================================================
# This workflow runs tests and lint on every push/PR. If CI fails, it
# automatically diagnoses the issue, creates a GitHub issue with full context,
# and assigns GitHub Copilot coding agent to fix it via a pull request.
#
# Kill switch: Set repository variable ENABLE_SELF_HEAL=false to disable.
# ============================================================================

name: CI Pipeline (Self-Healing)

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  # ===========================================================================
  # Job 1: Build, Lint, and Test
  # ===========================================================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    outputs:
      test-status: ${{ steps.test.outcome }}
      lint-status: ${{ steps.lint.outcome }}
      build-status: ${{ steps.build.outcome }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        id: install
        run: |
          set -o pipefail
          npm ci 2>&1 | tee ci-output.log

      - name: Run linter
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          npm run lint:json 2>&1 | tee -a ci-output.log
          npm run lint 2>&1 | tee -a ci-output.log

      - name: Run build check
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          npm run build 2>&1 | tee -a ci-output.log

      - name: Run tests
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:json 2>&1 | tee -a ci-output.log
          npm test 2>&1 | tee -a ci-output.log

      - name: Upload CI artifacts
        if: steps.test.outcome == 'failure' || steps.lint.outcome == 'failure' || steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-artifacts
          path: |
            ci-output.log
            test-results.json
            lint-output.json
          retention-days: 5

      - name: Check results
        run: |
          echo "Lint: ${{ steps.lint.outcome }}"
          echo "Build: ${{ steps.build.outcome }}"
          echo "Test: ${{ steps.test.outcome }}"
          if [[ "${{ steps.lint.outcome }}" == "failure" ]] || \
             [[ "${{ steps.build.outcome }}" == "failure" ]] || \
             [[ "${{ steps.test.outcome }}" == "failure" ]]; then
            echo "CI_FAILED=true" >> "$GITHUB_ENV"
            exit 1
          fi

  # ===========================================================================
  # Job 2: Auto-Heal (runs only on failure)
  # ===========================================================================
  auto-heal:
    name: Auto-Heal (Attempt ${{ github.run_attempt }})
    needs: build-and-test
    if: |
      always() &&
      needs.build-and-test.result == 'failure' &&
      github.event_name == 'push' &&
      vars.ENABLE_SELF_HEAL != 'false' &&
      github.run_attempt <= 3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download failure artifacts
        uses: actions/download-artifact@v4
        with:
          name: ci-failure-artifacts
        continue-on-error: true

      - name: Reproduce failures and diagnose
        id: diagnose
        run: |
          # Re-run failing steps to generate fresh output files
          npm run lint:json 2>&1 || true
          npm run test:json 2>&1 || true
          npm run build 2>&1 | tee ci-output.log || true

          # Run failure handlers to classify the issue
          chmod +x scripts/handlers/*.sh
          DIAGNOSIS=""
          FAILURE_TYPE="unknown"

          for handler in scripts/handlers/*-handler.sh; do
            if [ ! -f "$handler" ]; then continue; fi
            handler_name=$(basename "$handler" .sh)
            echo "Trying handler: $handler_name"

            if handler_output=$(bash "$handler" ci-output.log 2>/dev/null); then
              echo "Handler matched: $handler_name"
              DIAGNOSIS="$handler_output"
              FAILURE_TYPE=$(echo "$handler_output" | node -e "
                let d=''; process.stdin.on('data',c=>d+=c);
                process.stdin.on('end',()=>{ try{console.log(JSON.parse(d).type)}catch(e){console.log('unknown')} });
              ")
              break
            fi
          done

          if [ -z "$DIAGNOSIS" ]; then
            DIAGNOSIS='{"type":"unknown","healable":true,"failures":[],"relevantFiles":[]}'
          fi

          echo "failure_type=$FAILURE_TYPE" >> "$GITHUB_OUTPUT"

          # Save diagnosis and log tail to files for the next step
          echo "$DIAGNOSIS" > /tmp/diagnosis.json
          tail -100 ci-output.log > /tmp/ci-log-tail.txt 2>/dev/null || true

          # Save to audit directory
          mkdir -p .heal-audit
          cp /tmp/diagnosis.json .heal-audit/diagnosis.json

      - name: Create issue
        id: create-issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let diagnosis = '';
            try {
              diagnosis = fs.readFileSync('/tmp/diagnosis.json', 'utf8');
            } catch (e) {
              diagnosis = '{"type":"unknown","failures":[]}';
            }

            let logTail = '';
            try {
              logTail = fs.readFileSync('/tmp/ci-log-tail.txt', 'utf8');
            } catch (e) {
              logTail = 'Could not read CI log.';
            }

            const failureType = '${{ steps.diagnose.outputs.failure_type }}' || 'unknown';

            // Read the heal prompt for instructions
            let healInstructions = '';
            try {
              healInstructions = fs.readFileSync('scripts/prompts/heal-prompt.md', 'utf8');
            } catch (e) {
              healInstructions = 'Fix the CI failure based on the diagnosis above.';
            }

            const title = `Auto-heal: CI ${failureType} failure on \`${{ github.ref_name }}\``;
            const body = [
              '## CI Pipeline Failure — Auto-Heal Request',
              '',
              `| Field | Value |`,
              `|-------|-------|`,
              `| **Branch** | \`${{ github.ref_name }}\` |`,
              `| **Commit** | \`${{ github.sha }}\` |`,
              `| **Failure Type** | \`${failureType}\` |`,
              `| **Run** | [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |`,
              `| **Attempt** | ${{ github.run_attempt }} |`,
              '',
              '## Diagnosis',
              '',
              '```json',
              diagnosis,
              '```',
              '',
              '## CI Log (last 100 lines)',
              '',
              '```',
              logTail,
              '```',
              '',
              '## Fix Instructions',
              '',
              healInstructions,
              '',
              '---',
              '*This issue was created automatically by the self-healing CI pipeline.*'
            ].join('\n');

            // Ensure labels exist
            for (const label of ['ci-failure', 'auto-heal']) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label
                });
              } catch {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                  color: label === 'ci-failure' ? 'D73A4A' : '0E8A16'
                });
              }
            }

            // Create the issue
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['ci-failure', 'auto-heal']
            });

            core.info(`Created issue #${issue.data.number}`);
            core.setOutput('issue_number', issue.data.number);

      - name: Assign Copilot to issue
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          ISSUE=${{ steps.create-issue.outputs.issue_number }}
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::GH_PAT secret not set — cannot assign Copilot. Set a PAT with repo scope as GH_PAT secret."
            exit 0
          fi
          echo "Assigning Copilot coding agent to issue #$ISSUE..."

          # Get the issue's node ID via GraphQL
          ISSUE_NODE_ID=$(gh api graphql -f query='
            query($owner: String!, $repo: String!, $number: Int!) {
              repository(owner: $owner, name: $repo) {
                issue(number: $number) { id }
              }
            }' -f owner="${{ github.repository_owner }}" \
               -f repo="$(echo '${{ github.repository }}' | cut -d/ -f2)" \
               -F number="$ISSUE" \
               --jq '.data.repository.issue.id')

          if [ -z "$ISSUE_NODE_ID" ]; then
            echo "::warning::Could not retrieve issue node ID for #$ISSUE"
            exit 0
          fi

          # Assign Copilot via GraphQL mutation (bot node ID)
          COPILOT_BOT_ID="BOT_kgDOC9w8XQ"
          RESULT=$(gh api graphql -f query="
            mutation {
              addAssigneesToAssignable(input: {
                assignableId: \"$ISSUE_NODE_ID\",
                assigneeIds: [\"$COPILOT_BOT_ID\"]
              }) {
                assignable {
                  ... on Issue { assignees(first: 5) { nodes { login } } }
                }
              }
            }" 2>&1) || true

          if echo "$RESULT" | grep -q '"Copilot"'; then
            echo "Successfully assigned Copilot to issue #$ISSUE"
          else
            echo "::warning::GraphQL mutation may have failed. Response: $RESULT"
          fi

      - name: Upload heal audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heal-audit-attempt-${{ github.run_attempt }}
          path: .heal-audit/
          retention-days: 30

  # ===========================================================================
  # Job 3: Fallback — create issue when healing is exhausted
  # ===========================================================================
  fallback:
    name: Create Issue (Heal Exhausted)
    needs: [build-and-test, auto-heal]
    if: |
      always() &&
      needs.auto-heal.result == 'failure' &&
      github.run_attempt >= 3
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub Issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = `CI self-healing exhausted on ${context.ref}`;
            const body = [
              '## Self-Healing Pipeline Exhausted',
              '',
              `**Branch:** \`${context.ref}\``,
              `**Commit:** \`${context.sha}\``,
              `**Workflow Run:** [View run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              `**Attempts:** 3 / 3`,
              '',
              '### What happened',
              'The CI pipeline failed and the self-healing agent was unable to fix the issue after 3 attempts.',
              '',
              '### Next steps',
              '1. Review the workflow run logs and heal audit artifacts.',
              '2. Fix the issue manually.',
              '3. Re-enable self-healing if it was disabled.',
              '',
              '---',
              '*This issue was created automatically by the self-healing CI pipeline.*'
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['ci-failure', 'auto-heal-exhausted']
            });
